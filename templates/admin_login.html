<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication - Future & Career Intelligence</title>
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #141210;
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --border-color: #292524;
            --border-focus: #d97706;
            --input-bg: #1c1917;
            --button-bg: #f5f5f4;
            --button-text: #0c0a09;
            --button-hover: #e7e5e4;
            --shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 45px;
            border-radius: 4px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
        }
        h2 { 
            margin-top: 0; 
            font-size: 20px; 
            font-weight: 500; 
            letter-spacing: -0.02em;
            margin-bottom: 8px; 
        }
        p { 
            color: var(--text-secondary); 
            font-size: 14px; 
            margin-bottom: 30px; 
            line-height: 1.5;
        }
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            font-size: 13px; 
            letter-spacing: 0.02em;
            text-transform: uppercase; 
            color: var(--text-secondary); 
            margin-bottom: 8px; 
            font-weight: 500; 
        }
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 2px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input[type="password"]:focus { 
            border-color: var(--border-focus); 
        }
        .login-btn {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.05em;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .login-btn:hover { 
            background: var(--button-hover); 
        }
        #error-msg { 
            color: #ef4444; 
            font-size: 13px; 
            margin-top: 15px; 
            text-align: center; 
            display: none; 
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Authentication</h2>
        <p>Enter your password to access analytics and survey responses.</p>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="••••" required>
            </div>
            <button type="submit" class="login-btn">Access Portal</button>
            <div id="error-msg">Incorrect password. Please try again.</div>
        </form>
        <a href="/" class="back-link">← Back to Survey Form</a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;

            fetch('/admin_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => {
                if(res.ok) {
                    window.location.reload();
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
