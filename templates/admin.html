<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #141210;
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --border-color: #292524;
            --accent: #d97706;
        }
        body {
            font-family: 'Instrument Sans', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 500; }
        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 4px;
        }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--text-secondary); text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 32px; font-weight: 600; color: var(--accent); }
        
        .section-title { font-size: 20px; font-weight: 500; margin: 40px 0 20px 0; border-left: 3px solid var(--accent); padding-left: 10px; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        .chart-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 4px;
        }
        .chart-box h3 { font-size: 15px; margin-top: 0; margin-bottom: 15px; color: var(--text-primary); }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        th {
            background: #1c1917;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        tr:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Future & Career Intelligence - Admin Portal</h1>
        <a href="/" class="back-link">← Go Back to Survey</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Responses</h3>
            <p id="total-count">0</p>
        </div>
    </div>

    <div class="section-title">Visual Analytics & Question Breakdown</div>
    <div class="charts-grid" id="charts-container"></div>

    <div class="section-title">All Raw Entries (Table View)</div>
    <div class="table-container">
        <table id="responses-table">
            <thead>
                <tr id="table-head"></tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        fetch('/get_data')
        .then(res => res.json())
        .then(data => {
            document.getElementById('total-count').innerText = data.length;
            if(data.length === 0) return;

            const fixedOrder = ['Name', 'Gmail', 'Language'];
            for(let i = 1; i <= 16; i++) {
                const matchingKey = Object.keys(data[0]).find(k => k === `Q${i}_Education` || k.startsWith(`Q${i}_`));
                if(matchingKey) fixedOrder.push(matchingKey);
            }
            Object.keys(data[0]).forEach(k => {
                if(!fixedOrder.includes(k)) fixedOrder.push(k);
            });

            const headers = fixedOrder;

            const headTr = document.getElementById('table-head');
            headTr.innerHTML = '';
            headers.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h.replace(/_/g, ' ');
                headTr.appendChild(th);
            });

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.innerText = row[h] || '-';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            const chartsContainer = document.getElementById('charts-container');
            chartsContainer.innerHTML = '';
            for(let i = 1; i <= 15; i++) {
                const actualKey = headers.find(h => h.startsWith(`Q${i}_`));
                if(!actualKey) continue;

                const counts = {};
                data.forEach(row => {
                    const val = row[actualKey] || 'Unanswered';
                    counts[val] = (counts[val] || 0) + 1;
                });

                const box = document.createElement('div');
                box.className = 'chart-box';
                const h3 = document.createElement('h3');
                h3.innerText = actualKey.replace(/_/g, ' ');
                box.appendChild(h3);

                const canvas = document.createElement('canvas');
                box.appendChild(canvas);
                chartsContainer.appendChild(box);

                new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(counts),
                        datasets: [{
                            label: 'Selections',
                            data: Object.values(counts),
                            backgroundColor: '#d97706',
                            borderRadius: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { ticks: { color: '#a8a29e', precision: 0 }, grid: { color: '#292524' } },
                            x: { ticks: { color: '#a8a29e', font: { size: 10 } }, grid: { display: false } }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
