<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future & Career Intelligence Initiative</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        #modal-title { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-flex">
            <div>
                <h2 id="app-title">Future & Career Intelligence</h2>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
        </div>

        <!-- SCREEN 1: LANGUAGE SELECTION -->
        <div id="screen-lang" class="lang-screen">
            <h3 id="intro-main-title">Your thoughts to build a better</h3>
            <p id="intro-sub-title">Your answers are valuable for us. Be the part of changemaker</p>
            
            <p style="font-weight: 500; margin-bottom: 15px; font-size: 14px; color: var(--text-secondary); text-transform: uppercase;">Select your preferred language / भाषा चुनें</p>
            
            <div class="lang-grid">
                <div class="lang-card" onclick="setLanguage('en')">
                    <h3>English</h3>
                    <span>Continue in English</span>
                </div>
                <div class="lang-card" onclick="setLanguage('hi')">
                    <h3>हिंदी</h3>
                    <span>हिंदी में जारी रखें</span>
                </div>
            </div>
        </div>

        <!-- SCREEN 2: SURVEY FORM -->
        <div id="screen-form" class="hidden">
            <div style="margin-bottom: 30px;">
                <h2 id="form-main-title" style="margin: 0 0 6px 0; font-size: 24px; font-weight: 500;"></h2>
                <h3 id="form-alt-title" style="margin: 0 0 10px 0; font-size: 16px; color: var(--border-focus); font-weight: 500;"></h3>
                <p id="survey-desc" style="color: var(--text-secondary); font-size: 15px; margin: 0; line-height: 1.5;"></p>
                <p id="survey-desc-alt" style="color: var(--text-secondary); font-size: 15px; margin: 4px 0 0 0; line-height: 1.5;"></p>
            </div>
            
            <form id="surveyForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label id="lbl-name"></label>
                    <input type="text" id="userName" placeholder="Harshit Singh" required>
                </div>
                <div class="form-group">
                    <label id="lbl-gmail"></label>
                    <input type="text" id="userGmail" placeholder="name@example.com">
                </div>

                <div class="form-group"><label id="q1-label"></label><select id="q1"></select></div>
                <div class="form-group"><label id="q2-label"></label><select id="q2"></select></div>
                <div class="form-group"><label id="q3-label"></label><select id="q3"></select></div>
                <div class="form-group"><label id="q4-label"></label><select id="q4"></select></div>
                <div class="form-group"><label id="q5-label"></label><select id="q5"></select></div>
                <div class="form-group"><label id="q6-label"></label><select id="q6"></select></div>
                <div class="form-group"><label id="q7-label"></label><select id="q7"></select></div>
                <div class="form-group"><label id="q8-label"></label><select id="q8"></select></div>
                <div class="form-group"><label id="q9-label"></label><select id="q9"></select></div>
                <div class="form-group"><label id="q10-label"></label><select id="q10"></select></div>
                <div class="form-group"><label id="q11-label"></label><select id="q11"></select></div>
                <div class="form-group"><label id="q12-label"></label><select id="q12"></select></div>
                <div class="form-group"><label id="q13-label"></label><select id="q13"></select></div>
                
                <div class="form-group">
                    <label id="q14-label"></label>
                    <div id="q14-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;"></div>
                </div>

                <div class="form-group"><label id="q15-label"></label><select id="q15"></select></div>
                <div class="form-group"><label id="q16-label"></label><textarea id="q16" placeholder="Share your thoughts..."></textarea></div>

                <button type="submit" class="submit-btn" id="submit-btn-text">Submit Survey</button>
            </form>
        </div>

        <!-- SCREEN 3: SUCCESS -->
        <div id="screen-success" class="hidden" style="text-align: center; padding: 40px 0;">
            <h3 id="success-msg" style="color: var(--text-primary); font-size: 24px; font-weight: 500; margin-bottom: 12px;"></h3>
            <p id="success-sub-msg" style="color: var(--text-secondary); font-size: 16px; line-height: 1.6; margin-bottom: 35px;"></p>
            <button class="action-btn" onclick="resetSurvey()" id="restart-btn-text" style="max-width: 250px; margin: 0 auto;">Start New Survey</button>
        </div>
    </div>

    <div id="modal-popup" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="modal-title"></h3>
            <p id="modal-desc" style="font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 25px;"></p>
            <div class="modal-buttons">
                <button class="modal-btn btn-back" id="modal-btn-back" onclick="closeModal()">Go Back</button>
                <button class="modal-btn btn-proceed" id="modal-btn-proceed" onclick="confirmSubmit()" style="display:none;">Yes, Submit Anyway</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let isForcedSubmit = false;

        // Data object (remains same)
        const data = { /* ... (keep your existing data object) ... */ }; 
        // Note: I'm skipping the copy-paste of the big object to keep it short, 
        // but ensure your existing 'data' constant is here.

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById("screen-lang").classList.add("hidden");
            document.getElementById("screen-form").classList.remove("hidden");
            
            const langData = data[lang];
            // ... (keep your existing translation code) ...
            
            // Re-rendering Q14 radio buttons correctly
            const q14Container = document.getElementById('q14-container');
            q14Container.innerHTML = "";
            langData.questions[13].options.forEach((opt) => {
                const wrapper = document.createElement('label');
                wrapper.style.cssText = "display: flex; align-items: flex-start; gap: 10px; background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 2px; cursor: pointer;";
                const radio = document.createElement('input');
                radio.type = 'radio'; radio.name = 'q14_selection'; radio.value = opt;
                wrapper.appendChild(radio);
                wrapper.appendChild(document.createTextNode(opt));
                q14Container.appendChild(wrapper);
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById("userName").value.trim();
            const gmail = document.getElementById("userGmail").value.trim();
            const problem = document.getElementById("q16").value.trim();
            const langData = data[currentLang];

            // Validate all
            let missing = [];
            // Validate Selects 1-13, 15
            for(let i=1; i<=13; i++) if(!document.getElementById(`q${i}`).value) missing.push(langData.questions[i-1].label);
            if(!document.querySelector('input[name="q14_selection"]:checked')) missing.push(langData.questions[13].label);
            if(!document.getElementById('q15').value) missing.push(langData.questions[14].label);

            if(missing.length > 0) {
                alert("Please fill all required fields: " + missing[0]);
                return;
            }

            if(!isForcedSubmit && (!gmail || !problem)) {
                if(confirm("Submit without Gmail/Feedback?")) {
                    isForcedSubmit = true;
                    sendDataToServer();
                }
            } else {
                sendDataToServer();
            }
        }

        function sendDataToServer() {
            const formData = {
                Name: document.getElementById("userName").value,
                Gmail: document.getElementById("userGmail").value,
                Language: currentLang,
                Q1_Education: document.getElementById("q1").value,
                Q2_Status: document.getElementById("q2").value,
                Q3_Field: document.getElementById("q3").value,
                Q4_Challenge: document.getElementById("q4").value,
                Q5_Sufficiency: document.getElementById("q5").value,
                Q6_Gap: document.getElementById("q6").value,
                Q7_Confidence: document.getElementById("q7").value,
                Q8_Importance: document.getElementById("q8").value,
                Q9_Format: document.getElementById("q9").value,
                Q10_Time: document.getElementById("q10").value,
                Q11_Duration: document.getElementById("q11").value,
                Q12_Investment: document.getElementById("q12").value,
                Q13_Payment: document.getElementById("q13").value,
                Q14_Priority: document.querySelector('input[name="q14_selection"]:checked').value,
                Q15_Interest: document.getElementById("q15").value,
                Q16_Problem: document.getElementById("q16").value
            };

            fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("screen-form").classList.add("hidden");
                document.getElementById("screen-success").classList.remove("hidden");
            });
        }
    </script>
</body>
</html>
