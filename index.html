<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future & Career Intelligence Initiative</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #141210;
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --border-color: #292524;
            --border-focus: #d97706;
            --input-bg: #1c1917;
            --button-bg: #f5f5f4;
            --button-text: #0c0a09;
            --button-hover: #e7e5e4;
            --shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        [data-theme="light"] {
            --bg-color: #f5f5f4;
            --card-bg: #ffffff;
            --text-primary: #1c1917;
            --text-secondary: #78716c;
            --border-color: #e7e5e4;
            --border-focus: #d97706;
            --input-bg: #fafaf9;
            --button-bg: #1c1917;
            --button-text: #f5f5f4;
            --button-hover: #292524;
            --shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 6px;
            width: 100%;
            max-width: 650px;
            box-shadow: var(--shadow);
            box-sizing: border-box;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h2 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
        
        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .lang-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.2s, transform 0.2s;
        }

        .lang-card:hover {
            border-color: var(--border-focus);
            transform: translateY(-2px);
        }

        .lang-card h3 { margin: 0 0 8px 0; font-size: 18px; color: var(--text-primary); }
        .lang-card span { font-size: 13px; color: var(--text-secondary); }

        .form-group { margin-bottom: 22px; }
        label { display: block; font-size: 13px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
        
        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--border-focus); }
        textarea { resize: vertical; min-height: 100px; }

        .submit-btn, .action-btn {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.05em;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .submit-btn:hover, .action-btn:hover { background: var(--button-hover); }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 6px; max-width: 400px; width: 90%;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; border: none; }
        .btn-back { background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-proceed { background: #d97706; color: #fff; }
        #modal-title { color: #ef4444; margin-top: 0; }
    </style>
</head>

                <div class="form-group"><label id="q6-label"></label><select id="q6"></select></div>

                <div class="form-group"><label id="q10-label"></label><select id="q10"></select></div>
                <div class="form-group"><label id="q11-label"></label><select id="q11"></select></div>
                <div class="form-group"><label id="q12-label"></label><select id="q12"></select></div>
                <div class="form-group"><label id="q13-label"></label><select id="q13"></select></div>

                <div class="form-group"><label id="q16-label"></label><textarea id="q16" placeholder="Share your thoughts..."></textarea></div>

            </form>
        </div>

        </div>
    </div>

                    { label: "11. आप किस अवधि के करियर विकास कार्यक्रम को पसंद करेंगे?", options: ["6 महीने – 1 वर्ष", "2 वर्ष", "3 वर्ष", "मुझे नहीं पता", "अन्य"] },
                    { label: "12. आप अपने करियर कौशल को सीखने/सुधारने में कितना निवेश कर सकते हैं?", options: ["केवल मुफ्त", "₹10,000–₹50,000", "₹50,000–₹1,00,000", "₹1,00,000–₹3,00,000", "+3,00,000"] },
                    { label: "13. आप किस भुगतान मॉडल को पसंद करेंगे?", options: ["एकमुश्त भुगतान (One-time payment)", "मासिक भुगतान योजना", "नौकरी मिलने के बाद भुगतान करें", "अन्य"] },
                    { label: "14. नौकरी-उन्मुख या कौशल-निर्माण संस्थान में शामिल होने का निर्णय लेते समय आपकी सर्वोच्च प्राथमिकता क्या है?", options: ["गारंटीड नौकरी के अवसर", "गुणवत्तापूर्ण शिक्षा / उच्च मूल्य", "उद्योग के मेंटर्स", "इंटर्नशिप के अवसर", "केवल किफायती (कम) कीमत", "गुणवत्तापूर्ण शिक्षा / उद्योग विशेषज्ञ / गारंटीड नौकरी / नौकरी न मिलने पर 50% फीस वापसी / विश्व स्तरीय लाइब्रेरी / कार्यशालाएं / लाइव प्रोजेक्ट अनुभव / गारंटीड इंटर्नशिप / सीवी से जॉब इंटरव्यू तैयारी समर्थन"] },
                    { label: "15. यदि कोई संस्थान आपको एक संपूर्ण यात्रा प्रदान करे (कौशल + प्रोजेक्ट्स + 100% इंटर्नशिप + 100% नौकरी सहायता), तो आप कितने इच्छुक होंगे?", options: ["A) 100% इच्छुक", "B) 0% या रुचि नहीं है"] },
                    { label: "16. शिक्षा, कौशल या नौकरी पाने से संबंधित आज आप सबसे बड़ी समस्या कौन सी फेस कर रहे हैं? (वैकल्पिक)" }
                ]
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            // Theme toggle button
            document.getElementById("themeToggleBtn").addEventListener("click", () => {
                const html = document.documentElement;
                const current = html.getAttribute("data-theme");
                html.setAttribute("data-theme", current === "dark" ? "light" : "dark");
            });

            // Language cards
            document.getElementById("lang-en-btn").addEventListener("click", () => setLanguage('en'));
            document.getElementById("lang-hi-btn").addEventListener("click", () => setLanguage('hi'));

            // Form submit
            document.getElementById("surveyForm").addEventListener("submit", handleFormSubmit);

            // Modal buttons
            document.getElementById("modal-btn-back").addEventListener("click", closeModal);
            document.getElementById("modal-btn-proceed").addEventListener("click", confirmSubmit);

            // Restart button
            document.getElementById("restart-btn-text").addEventListener("click", resetSurvey);
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById("screen-lang").classList.add("hidden");
            document.getElementById("screen-form").classList.remove("hidden");
            
            const langData = data[lang];
            document.getElementById("app-title").innerText = langData.appTitle;
            document.getElementById("form-main-title").innerText = langData.mainTitle;
            document.getElementById("form-alt-title").innerText = langData.altTitle;
            document.getElementById("survey-desc").innerText = langData.desc;
            document.getElementById("survey-desc-alt").innerText = langData.descAlt;
            document.getElementById("lbl-name").innerText = langData.name;
            document.getElementById("lbl-gmail").innerText = langData.gmail;
            document.getElementById("submit-btn-text").innerText = langData.submit;

            langData.questions.forEach((q, index) => {
                const qNum = index + 1;
                const labelElem = document.getElementById(`q${qNum}-label`);
                if(labelElem) labelElem.innerText = q.label;

                if(qNum === 14) {
                    const container = document.getElementById(`q14-container`);
                    if(container && q.options) {
                        container.innerHTML = "";
                        q.options.forEach((opt) => {
                            const wrapper = document.createElement('label');
                            wrapper.style.cssText = "display: flex; align-items: flex-start; gap: 10px; background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 1.4; color: var(--text-primary);";
                            
                            const radio = document.createElement('input');
                            radio.type = 'radio';
                            radio.name = 'q14_selection';
                            radio.value = opt;
                            radio.style.marginTop = "3px";

                            const span = document.createElement('span');
                            span.innerText = opt;

                            wrapper.appendChild(radio);
                            wrapper.appendChild(span);
                            container.appendChild(wrapper);
                        });
                    }
                    return;
                }

                const selectElem = document.getElementById(`q${qNum}`);
                if(selectElem && q.options) {
                    selectElem.innerHTML = "";
                    const defaultOpt = document.createElement("option");
                    defaultOpt.value = "";
                    defaultOpt.innerText = langData.defaultOption;
                    defaultOpt.disabled = true;
                    defaultOpt.selected = true;
                    selectElem.appendChild(defaultOpt);

                    q.options.forEach((opt) => {
                        const optElem = document.createElement("option");
                        optElem.value = opt;
                        optElem.innerText = opt;
                        selectElem.appendChild(optElem);
                    });
                }
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById("userName").value.trim();
            const gmail = document.getElementById("userGmail").value.trim();
            const problem = document.getElementById("q16").value.trim();
            const langData = data[currentLang];

            const proceedBtn = document.getElementById("modal-btn-proceed");
            const backBtn = document.getElementById("modal-btn-back");

            let missingFields = [];
            if (!name) missingFields.push(currentLang === 'en' ? "Your Name" : "आपका नाम");

            for (let i = 1; i <= 15; i++) {
                if(i === 14) {
                    const q14Val = document.querySelector('input[name="q14_selection"]:checked');
                    if(!q14Val) missingFields.push(langData.questions[13].label);
                    continue;
                }
                const val = document.getElementById(`q${i}`).value;
                if (!val) missingFields.push(langData.questions[i - 1].label);
            }

            if (missingFields.length > 0) {
                document.getElementById("modal-title").innerText = langData.missingTitle;
                document.getElementById("modal-desc").innerText = langData.missingDesc;
                backBtn.innerText = currentLang === 'en' ? "OK, Let me check" : "ठीक है, देखता हूँ";
                proceedBtn.style.display = "none";
                document.getElementById("modal-popup").classList.remove("hidden");
                return;
            }

            if (!isForcedSubmit && (!gmail || !problem)) {
                document.getElementById("modal-title").innerText = langData.optTitle;
                document.getElementById("modal-desc").innerText = langData.optDesc;
                backBtn.innerText = langData.backBtn;
                proceedBtn.innerText = langData.proceedBtn;
                proceedBtn.style.display = "block";
                document.getElementById("modal-popup").classList.remove("hidden");
                return;
            }

            sendDataToServer();
        }

        function closeModal() {
            document.getElementById("modal-popup").classList.add("hidden");
        }

        function confirmSubmit() {
            isForcedSubmit = true;
            closeModal();
            sendDataToServer();
        }

        async function sendDataToServer() {
            const q14Selection = document.querySelector('input[name="q14_selection"]:checked');
            const formData = {
                name: document.getElementById("userName").value.trim(),
                gmail: document.getElementById("userGmail").value.trim() || "Not Provided",
                language: currentLang,
                q1_education: document.getElementById("q1").value,
                q2_status: document.getElementById("q2").value,
                q3_field: document.getElementById("q3").value,
                q4_challenge: document.getElementById("q4").value,
                q5_sufficiency: document.getElementById("q5").value,
                q6_gap: document.getElementById("q6").value,
                q7_confidence: document.getElementById("q7").value,
                q8_importance: document.getElementById("q8").value,
                q9_format: document.getElementById("q9").value,
                q10_time: document.getElementById("q10").value,
                q11_duration: document.getElementById("q11").value,
                q12_investment: document.getElementById("q12").value,
                q13_payment: document.getElementById("q13").value,
                q14_priority: q14Selection ? q14Selection.value : "",
                q15_interest: document.getElementById("q15").value,
                q16_problem: document.getElementById("q16").value || "Not Provided"
            };

            try {
                const { error } = await supabaseClient
                    .from('responses')
                    .insert([formData]);

                if (error) {
                    console.error("Supabase Error:", error);
                    alert("Error saving data: " + error.message);
                } else {
                    document.getElementById("screen-form").classList.add("hidden");
                    document.getElementById("screen-success").classList.remove("hidden");
                    const langData = data[currentLang];
                    document.getElementById("success-msg").innerText = langData.successMain;
                    document.getElementById("success-sub-msg").innerText = langData.successSub;
                    document.getElementById("restart-btn-text").innerText = langData.restart;
                }
            } catch (err) {
                console.error("Network Exception:", err);
                alert("Failed to connect to database.");
            }
        }

        function resetSurvey() {
            document.getElementById("surveyForm").reset();
            isForcedSubmit = false;
            document.getElementById("screen-success").classList.add("hidden");
            document.getElementById("screen-lang").classList.remove("hidden");
        }
    </script>
</body>
</html>
