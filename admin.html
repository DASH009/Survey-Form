<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #141210;
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --border-color: #292524;
            --accent: #d97706;
        }
        body {
            font-family: 'Instrument Sans', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 500; }
        .nav-links a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; margin-left: 20px; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 4px; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--text-secondary); text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 32px; font-weight: 600; color: var(--accent); }
        .section-title { font-size: 20px; font-weight: 500; margin: 40px 0 20px 0; border-left: 3px solid var(--accent); padding-left: 10px; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .chart-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 4px; }
        .chart-box h3 { font-size: 15px; margin-top: 0; margin-bottom: 15px; color: var(--text-primary); }
        .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        th { background: #1c1917; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Future & Career Intelligence - Admin Portal</h1>
        <div class="nav-links">
            <a href="/">← Go Back to Survey</a>
            <a onclick="clearDatabase()" style="color: #ef4444;">Clear Data 🗑️</a>
            <a onclick="logoutAdmin()">Logout 🔒</a>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Responses</h3>
            <p id="total-count">0</p>
        </div>
    </div>

    <div class="section-title">Visual Analytics & Question Breakdown</div>
    <div class="charts-grid" id="charts-container"></div>

    <div class="section-title">All Raw Entries (Table View)</div>
    <div class="table-container">
        <table id="responses-table">
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://tzcgxnhqcxekjgzwnmk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BI0lxqFDJwtvUZs7dbqJTQ_QW8BHZFW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function checkAdminAuth() {
            if (localStorage.getItem("admin_logged_in") !== "true") {
                const pass = prompt("Enter Admin Password:");
                if (pass === "jhakaas") {
                    localStorage.setItem("admin_logged_in", "true");
                } else {
                    alert("Wrong password!");
                    window.location.href = '/';
                }
            }
        }

        checkAdminAuth();

        async function fetchAdminData() {
            const { data, error } = await supabaseClient
                .from('responses')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error("Supabase Error:", error);
                alert("Error fetching data: " + error.message);
                return;
            }

            if (!data || data.length === 0) {
                document.getElementById('total-count').innerText = "0";
                return;
            }

            document.getElementById('total-count').innerText = data.length;

            const keys = Object.keys(data[0]);
            let headers = ['id', 'name', 'gmail', 'language'];
            
            keys.forEach(k => {
                if (!headers.includes(k) && (k.startsWith('q') || k.startsWith('Q'))) {
                    headers.push(k);
                }
            });

            if(headers.length <= 4) {
                headers = keys;
            }
            
            const headTr = document.getElementById('table-head');
            headTr.innerHTML = '';
            headers.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h.replace(/_/g, ' ').toUpperCase();
                headTr.appendChild(th);
            });

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.innerText = row[h] !== undefined && row[h] !== null ? row[h] : '-';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            const chartsContainer = document.getElementById('charts-container');
            chartsContainer.innerHTML = '';
            
            for(let i = 1; i <= 15; i++) {
                const qKey = keys.find(h => h.toLowerCase() === `q${i}` || h.toLowerCase().startsWith(`q${i}_`));
                if(!qKey) continue;

                const counts = {};
                data.forEach(row => {
                    const val = row[qKey] || 'Unanswered';
                    counts[val] = (counts[val] || 0) + 1;
                });

                const box = document.createElement('div');
                box.className = 'chart-box';
                box.innerHTML = `<h3>${qKey.replace(/_/g, ' ').toUpperCase()}</h3><div style="position: relative; height: 250px;"><canvas></canvas></div>`;
                chartsContainer.appendChild(box);

                new Chart(box.querySelector('canvas'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(counts),
                        datasets: [{ data: Object.values(counts), backgroundColor: '#d97706', borderRadius: 2 }]
                    },
                    options: { 
                        indexAxis: 'y',
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: {
                                ticks: { stepSize: 1, precision: 0, color: '#a8a29e' },
                                grid: { color: '#292524' }
                            },
                            y: {
                                ticks: { color: '#a8a29e', font: { size: 10 } },
                                grid: { display: false }
                            }
                        }
                    }
                });
            }
        }

        async function clearDatabase() {
            if(confirm("Do you want to clear all data?")) {
                const { error } = await supabaseClient.from('responses').delete().neq('id', 0);
                if(!error) {
                    window.location.reload();
                } else {
                    alert("Failed to clear data: " + error.message);
                }
            }
        }

        function logoutAdmin() {
            localStorage.removeItem("admin_logged_in");
            window.location.href = '/';
        }

        fetchAdminData();
    </script>
</body>
</html>
